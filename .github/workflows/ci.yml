name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Los tres tsconfig: front, worker y tests.
      - run: npm run typecheck

      - run: npm test

      # El build corre build-sw.mjs: si el script del SW se rompe, se ve acá.
      - run: npm run build
